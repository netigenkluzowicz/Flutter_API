name: flutter_api
description: Flutter API for app development.
version: 3.45.0+0
repository: https://github.com/netigenkluzowicz/Flutter_API

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  app_tracking_transparency: ^2.0.7
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11+1
  # package_info_plus >=6.0.0 <8.0.0 to be compatible with wakelock_plus 1.2.4
  # - fixed in wakelock_plus 1.2.5
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.4
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.10.9
  webview_flutter_wkwebview: ^3.23.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
