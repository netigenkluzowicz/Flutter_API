name: flutter_api
description: Flutter API for app development.
version: 3.32.4+4
homepage:

environment:
  sdk: '>=3.8.1 <4.0.0'
  flutter: '>=3.32.4'

dependencies:
  app_settings: ^6.1.1
  app_tracking_transparency: ^2.0.6
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  google_mobile_ads: ^6.0.0
  http:
  in_app_purchase: 3.2.3
  in_app_purchase_storekit: 0.4.3
  # package_info_plus >=6.0.0 <8.0.0 to be compatible with wakelock_plus 1.2.4
  # - fixed in wakelock_plus 1.2.5
  package_info_plus: ^8.3.0
  webview_flutter: ^4.9.0
  webview_flutter_android: ^4.0.0
  webview_flutter_wkwebview: ^3.18.4
  win32: ^5.5.4 # fix error: win32 Error: Type 'UnmodifiableUint8ListView'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
